
  <!-- ── Contact ──────────────────────────────────────────── -->
  <section class="band contact commitment" id="contact">
    <div class="wrap narrow">
      <p class="eyebrow reveal">{{contact_eyebrow}}</p>
      <h2 class="reveal">{{contact_heading}}</h2>
      <p class="lead reveal">
        {{contact_lead}}
      </p>
      <p class="reveal">
        <a class="mail" href="mailto:{{contact_email}}">{{contact_email}}</a>
      </p>
    </div>
  </section>
