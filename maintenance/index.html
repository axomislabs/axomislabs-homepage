<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Axomis Labs</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/favicon-180.png">
<style>
  :root { --bg: #F7F5F0; --text: #2E3133; --muted: #676B6D; --rule: #D7CFC3; --accent: #8F4F28; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #212426; --text: #F7F5F0; --muted: #A5A099; --rule: #3B3F41; --accent: #D08A5C; }
    .mark { filter: invert(1) brightness(1.6); }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem;
    background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.5;
  }
  main { max-width: 32rem; text-align: center; }
  .mark { width: 64px; height: auto; margin-bottom: 2rem; }
  p { margin: 0 0 1.25rem; }
  p[lang] { color: var(--muted); }
  p:first-of-type { color: var(--text); font-size: 1.125rem; }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 2rem auto; width: 4rem; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img class="mark" src="/logo-mark.svg" alt="Axomis Labs">
  <p>This website is temporarily unavailable.</p>
  <p lang="de">Diese Website ist vorübergehend nicht erreichbar.</p>
  <p lang="es">Este sitio web no está disponible temporalmente.</p>
  <hr>
  <p><a href="mailto:info@axomislabs.com">info@axomislabs.com</a></p>
</main>
</body>
</html>
